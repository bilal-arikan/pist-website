<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Nefes Atölyesi Katılımcılar (Gizli)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="../css/pist.shared.css" rel="stylesheet" type="text/css" />
  <link href="../css/shared-styles.css" rel="stylesheet" type="text/css" />
  <link href="../css/theme-colors.css" rel="stylesheet" type="text/css" />
  <link href="../css/responsive.css" rel="stylesheet" type="text/css" />
  <link href="../css/navbar.css" rel="stylesheet" type="text/css" />
  <link href="../css/footer.css" rel="stylesheet" type="text/css" />
  <style>
    .lock_wrap{max-width:560px;margin:40px auto;padding:16px;border:1px solid #eee;border-radius:12px}
    .lock_row{display:flex;gap:8px;margin-top:8px}
  .lock_row input{flex:1;padding:10px 12px;border:1px solid #ccc;border-radius:10px;color:#9aa0a6;background:#fff}
    .table_container{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .table{width:100%;border-collapse:collapse;margin-top:24px;min-width:640px}
    .table th,.table td{border:1px solid #eee;padding:8px 10px;font-size:.95rem}
  .table th{background:#fafafa;text-align:left;color:#111;white-space:nowrap}
  .table td{word-break:break-word;color:#333;background:#fff}
  .table tr{background:transparent}
  .stats_bar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
  .filter_toggle{margin-right:auto;display:flex;align-items:center;gap:6px;font-size:.9rem;color:#333}
  .filter_toggle input{accent-color:#aa3b7f}
    .badge{background:#f3f3f3;border:1px solid #e7e7e7;border-radius:999px;padding:6px 10px;font-size:.9rem;color:#333}
    @media (max-width:600px){
      /* Card layout for mobile */
      .table{min-width:0 !important;border:0}
      .table thead{display:none}
      .table, .table tbody, .table tr, .table td{display:block;width:100%}
      .table tr{border:1px solid #eee;border-radius:10px;margin-bottom:12px;padding:6px;background:#fff}
      .table td{border:0;border-bottom:1px solid #f3f3f3;padding:8px 8px 8px 112px;position:relative;font-size:.92rem}
      .table td:last-child{border-bottom:0}
      .table td:before{content:attr(data-label);position:absolute;left:10px;top:0;bottom:0;display:flex;align-items:center;font-weight:600;color:#555;max-width:100px}
      .stats_bar{justify-content:center}
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="navbar_wrap" role="banner">
      <div class="padding-global">
        <div class="w-layout-blockcontainer container-large w-container">
          <div class="padding-section">
            <h1>Nefes Atölyesi Katılımcılar</h1>
            <p class="text-style-muted">Bu sayfa gizlidir. Görüntülemek için şifre giriniz.</p>
            <div class="lock_wrap">
              <label for="pass">Şifre</label>
              <div class="lock_row">
                <input id="pass" type="password" placeholder="Şifre" />
                <button id="unlock" class="button" type="button"><div class="button_text">Giriş</div></button>
              </div>
              <p id="err" class="text-style-muted" style="color:#b00020;display:none">Şifre hatalı</p>
            </div>
            <div id="content" style="display:none">
              <div class="stats_bar">
                <label class="filter_toggle"><input type="checkbox" id="only-approved" /> Sadece onaylıları göster</label>
                <span class="badge"><strong>Onaylı:</strong> <span id="approved-count">0</span></span>
                <span class="badge"><strong>Toplam:</strong> <span id="total-count">0</span></span>
              </div>
              <div class="table_container">
                <table class="table">
                <thead>
                  <tr><th>Onay</th><th>#</th><th>İsim Soyisim</th><th>E-posta</th><th>Telefon</th><th>Tarih</th></tr>
                </thead>
                <tbody id="rows"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const STORAGE_KEY = 'pist_katilimcilar_nefes';
      const passInput = document.getElementById('pass');
      const unlockBtn = document.getElementById('unlock');
      const err = document.getElementById('err');
      const content = document.getElementById('content');
      const rows = document.getElementById('rows');
  const approvedCountEl = document.getElementById('approved-count');
  const totalCountEl = document.getElementById('total-count');
  const APPROVE_KEY = 'pist_katilimcilar_nefes_onay';
  const FILTER_KEY = 'pist_katilimcilar_nefes_filter_approved';
  const onlyApprovedCb = document.getElementById('only-approved');

      function getList(){
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){ return []; }
      }
      function getShowOnly(){
        try { return localStorage.getItem(FILTER_KEY) === 'true'; } catch(e){ return false; }
      }
      function setShowOnly(val){
        try { localStorage.setItem(FILTER_KEY, String(!!val)); } catch(e){}
      }
      function getApprovals(){
        try { return JSON.parse(localStorage.getItem(APPROVE_KEY) || '[]'); } catch(e){ return []; }
      }
      function setApprovals(arr){
        try { localStorage.setItem(APPROVE_KEY, JSON.stringify(arr)); } catch(e){}
      }
      function isApproved(key){
        const arr = getApprovals();
        return arr.includes(String(key));
      }
      function toggleApproval(key, checked){
        const arr = getApprovals();
        const sKey = String(key);
        const idx = arr.indexOf(sKey);
        if (checked && idx === -1) arr.push(sKey);
        if (!checked && idx !== -1) arr.splice(idx,1);
        setApprovals(arr);
      }
      function updateStats(list){
        const total = list.length;
        const approved = getApprovals().length;
        if (approvedCountEl) approvedCountEl.textContent = String(approved);
        if (totalCountEl) totalCountEl.textContent = String(total);
      }
      function render(){
        rows.innerHTML = '';
        const list = getList();
        const showOnly = getShowOnly();
        const view = showOnly ? list.filter(e=> isApproved(e.ts)) : list;
        view.forEach((e,i)=>{
          const tr = document.createElement('tr');
          const date = new Date(e.ts).toLocaleString('tr-TR');
          const approved = isApproved(e.ts);
          tr.innerHTML = `
            <td data-label="Onay"><input type="checkbox" class="approve_cb" data-key="${e.ts}" ${approved?'checked':''} /></td>
            <td data-label="#">${(list.indexOf(e))+1}</td>
            <td data-label="İsim Soyisim">${e.name||''}</td>
            <td data-label="E-posta">${e.email||''}</td>
            <td data-label="Telefon">${e.phone||''}</td>
            <td data-label="Tarih">${date}</td>
          `;
          rows.appendChild(tr);
        });
        updateStats(list);
      }

      function unlock(){
        const val = passInput.value;
        if (val === '0000'){
          err.style.display = 'none';
          content.style.display = 'block';
          render();
        } else {
          err.style.display = 'block';
        }
      }

      unlockBtn.addEventListener('click', unlock);
      passInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter') unlock(); });
      rows.addEventListener('change', (e)=>{
        const cb = e.target.closest('.approve_cb');
        if (!cb) return;
        const key = cb.getAttribute('data-key');
        toggleApproval(key, cb.checked);
        updateStats(getList());
        if (getShowOnly()) render();
      });
      // Initialize filter checkbox state and wire
      (function initFilter(){
        if (!onlyApprovedCb) return;
        onlyApprovedCb.checked = getShowOnly();
        onlyApprovedCb.addEventListener('change', ()=>{ setShowOnly(onlyApprovedCb.checked); render(); });
      })();
    })();
  </script>
</body>
</html>
