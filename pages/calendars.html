  <script> 
    const CAL_LINKS = { 
      studio: "https://calendar.google.com/calendar/embed?src=kiqunu2icla1ldrs5bnn1rju9k%40group.calendar.google.com&ctz=Europe%2FIstanbul", 
      etkinlik: "https://calendar.google.com/calendar/embed?src=d1377db7a5fb5e08a86a1dc7cbfce8623b4b8da7ca06f722bc26abcf8ad1b4d3%40group.calendar.google.com&ctz=Europe%2FIstanbul", 
      rezervasyon: "https://calendar.google.com/calendar/appointments/AcZssZ3arV2rnIAAEs430p39YKJySDEOTASOOuvVKsg=?gv=true" 
    }; 
 
    const frame = document.getElementById('calendarFrame'); 
    const tabs = document.querySelectorAll('.tab'); 
 
    tabs.forEach(tab => { 
      tab.addEventListener('click', () => { 
        const key = tab.dataset.key; 
        frame.src = CAL_LINKS[key] || CAL_LINKS.studio; 
        tabs.forEach(t => t.setAttribute('aria-selected', 'false')); 
        tab.setAttribute('aria-selected', 'true'); 
        // Navbar linkleri varsa güncelle
    const linkStudio = document.getElementById('link-studio');
    const linkEgitim = document.getElementById('link-egitim');
    const linkEtkinlik = document.getElementById('link-etkinlik');
    const linkRezervasyon = document.getElementById('link-rezervasyon');
    
    if (linkStudio) linkStudio.setAttribute('aria-current', key==='studio' ? 'page' : 'false');
    if (linkEgitim) linkEgitim.setAttribute('aria-current', key==='egitim' ? 'page' : 'false');
    if (linkEtkinlik) linkEtkinlik.setAttribute('aria-current', key==='etkinlik' ? 'page' : 'false');
    if (linkRezervasyon) linkRezervasyon.setAttribute('aria-current', key==='rezervasyon' ? 'page' : 'false');
  }); 
}); 

// Navbar linkleri varsa event listener ekle
const linkRezervasyon = document.getElementById('link-rezervasyon');
const linkStudio = document.getElementById('link-studio');
const linkEgitim = document.getElementById('link-egitim');
const linkEtkinlik = document.getElementById('link-etkinlik');

if (linkRezervasyon) linkRezervasyon.addEventListener('click', () => document.getElementById('tab-rezervasyon').click());
if (linkStudio) linkStudio.addEventListener('click', () => document.getElementById('tab-studio').click());
if (linkEgitim) linkEgitim.addEventListener('click', () => document.getElementById('tab-egitim').click());
if (linkEtkinlik) linkEtkinlik.addEventListener('click', () => document.getElementById('tab-etkinlik').click()); 
 
    document.getElementById('year').textContent = new Date().getFullYear(); 
 
    function goHome(){ 
      if (location.protocol === 'file:') { 
        window.location.href = location.href.split('#')[0]; 
      } else { 
        window.location.href = '/'; 
      } 
    } 
    window.goHome = goHome; 
  </script>
