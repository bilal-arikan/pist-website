# Pist Studio — GitHub Pages dağıtımı
#
# ÖNKOŞUL: Repo ayarlarında Settings → Pages → Build and deployment →
# Source, "Deploy from a branch" yerine "GitHub Actions" olmalı.
# Bu ayar yapılmadan workflow hata verir (site etkilenmez).
#
# Yalnızca `pist` dalına push edilince yayınlar. Geliştirme `yeni-site`
# dalında yapılır; hazır olunca `pist`e merge edilir.

name: Derle ve yayınla

on:
  push:
    branches: [pist]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # Spotify anahtarları tanımlıysa katalog verisini tazele.
      # Tanımlı değilse sessizce atlanır, derleme devam eder.
      - name: Spotify katalogu
        if: ${{ env.SPOTIFY_CLIENT_ID != '' }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npm run spotify || echo "Spotify atlandı"

      - name: Derle
        run: npm run build

      # Doldurulmamış hukuk metni kazara yayına çıkmasın.
      #
      # ⚠️ GEÇİCİ İSTİSNA (6 Eylül 2026) — kurucunun bilinçli kararı.
      # Aydınlatma metninde ŞİRKET UNVANI, AÇIK ADRES ve KVKK BAŞVURU
      # E-POSTASI hâlâ boş; şirket henüz kurulmadığı için doldurulamıyor.
      # Siteye trafik gelmediği için risk kabul edildi.
      #
      # Bilgiler gelip alanlar doldurulunca AŞAĞIDAKİ env BLOĞUNU SİL —
      # kontrol o an tekrar devreye girer.
      - name: Yayın öncesi kontrol
        run: npm run kontrol
        env:
          IZIN_VER_YER_TUTUCU: "1"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
