<script>
// Mobile menu functionality
document.addEventListener('DOMContentLoaded', function() {
  const menuButton = document.querySelector('.navbar_menu_button');
  const menu = document.querySelector('.navbar_menu');
  const menuClose = document.querySelector('.navbar_menu_close');
  const body = document.body;
  
  function openMenu() {
    menu.classList.add('w--open');
    body.style.overflow = 'hidden';
  }
  
  function closeMenu() {
    menu.classList.remove('w--open');
    body.style.overflow = '';
  }
  
  if (menuButton) {
    menuButton.addEventListener('click', function(e) {
      e.preventDefault();
      if (menu.classList.contains('w--open')) {
        closeMenu();
      } else {
        openMenu();
      }
    });
  }
  
  if (menuClose) {
    menuClose.addEventListener('click', function(e) {
      e.preventDefault();
      closeMenu();
    });
  }
  
  // Close menu when clicking on menu links
  const menuLinks = document.querySelectorAll('.navbar_link, .navbar_dropdown_link');
  menuLinks.forEach(link => {
    link.addEventListener('click', function() {
      closeMenu();
    });
  });
  
  // Close menu when clicking outside
  menu.addEventListener('click', function(e) {
    if (e.target === menu) {
      closeMenu();
    }
  });
});
</script>
