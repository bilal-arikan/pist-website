<script>
// Simplified navbar functionality
document.addEventListener('DOMContentLoaded', function() {
  const navbar = document.querySelector('.navbar_wrap');
  const menuButton = document.querySelector('.navbar_menu_button');
  const menu = document.querySelector('.navbar_menu');
  const menuClose = document.querySelector('.navbar_menu_close');
  const body = document.body;
  
  // Scroll functionality
  function handleScroll() {
    navbar.classList.toggle('scrolled', window.scrollY > 50);
  }
  window.addEventListener('scroll', handleScroll);
  
  // Mobile menu functionality
  function toggleMenu() {
    const isOpen = menu.classList.toggle('w--open');
    body.style.overflow = isOpen ? 'hidden' : '';
  }
  
  function closeMenu() {
    menu.classList.remove('w--open');
    body.style.overflow = '';
  }
  
  // Event listeners
  menuButton?.addEventListener('click', (e) => {
    e.preventDefault();
    toggleMenu();
  });
  
  menuClose?.addEventListener('click', (e) => {
    e.preventDefault();
    closeMenu();
  });
  
  // Close menu on link clicks
  document.querySelectorAll('.navbar_link, .navbar_dropdown_link').forEach(link => {
    link.addEventListener('click', closeMenu);
  });
  
  // Close menu when clicking outside
  menu?.addEventListener('click', (e) => {
    if (e.target === menu) closeMenu();
  });
});
</script>
